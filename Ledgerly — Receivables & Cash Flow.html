        :root {
            --host-inset-start: var(--host-inset-left, 0px);
            --host-inset-end: var(--host-inset-right, 0px)
        }

        :root[dir=rtl] {
            --host-inset-start: var(--host-inset-right, 0px);
            --host-inset-end: var(--host-inset-left, 0px)
        }

        [data-chrome-root] {
            align-items: center;
            gap: 4px;
            display: flex
        }

        [data-chrome-root] svg {
            display: block
        }

        #hdr .cds-root {
            --cds-page-bg: var(--bg)
        }

        .avatar-pending {
            background: var(--hov);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: block
        }

        .show-comments-tab {
            top: 50%;
            z-index: 29;
            background: var(--bg, var(--cds-page-bg));
            border-radius: 0;
            border-start-start-radius: var(--cds-radius);
            border-end-start-radius: var(--cds-radius);
            position: fixed;
            inset-inline-end: calc(var(--content-scrollbar-w, 0px) + var(--host-inset-end, 0px));
            transform: translateY(-50%)
        }

        [data-notice-strips] {
            bottom: calc(16px + var(--keyboard-inset, 0px));
            left: calc(50% + (var(--host-inset-left, 0px) - var(--host-inset-right, 0px)) / 2)
        }

        [data-share-card-region] {
            inset-inline-end: calc(12px + var(--host-inset-end, 0px));
            bottom: calc(12px + var(--keyboard-inset, 0px));
            z-index: 30;
            position: fixed
        }

        [data-share-card-region][data-higher] {
            bottom: calc(88px + var(--keyboard-inset, 0px))
        }

        [data-share-card-region][data-crossed] {
            inset-inline-start: calc(12px + var(--host-inset-start, 0px));
            inset-inline-end: auto
        }

        html[data-composed-sidebar-open=beside] [data-share-card-region][data-crossed] {
            inset-inline-start: calc(12px + var(--host-inset-start, 0px) + var(--composed-sidebar-width, 0px))
        }

        .frame-comments-float {
            inset-inline-end: calc(12px + var(--content-scrollbar-w, 0px) + var(--host-inset-end, 0px));
            bottom: calc(12px + var(--keyboard-inset, 0px));
            z-index: 29;
            align-items: center;
            gap: 8px;
            display: flex;
            position: fixed
        }

        .frame-comments-float[data-comments-top] {
            bottom: auto
        }

        [data-comments-pill]:hover,
        [data-comment-edge-pile]:hover {
            background-image: linear-gradient(var(--cds-fill-ghost-hover), var(--cds-fill-ghost-hover))
        }

        .frame-comments-chip {
            background: var(--cds-page-bg);
            border: 1px solid var(--cds-border);
            border-radius: var(--cds-radius);
            display: inline-flex
        }

        @keyframes frame-comment-in {
            0% {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .frame-comment-in {
            animation: .28s cubic-bezier(.4, 0, .2, 1) frame-comment-in
        }

        @media (prefers-reduced-motion:reduce) {
            .frame-comment-in {
                animation: none
            }
        }

        @keyframes frame-claude-lands {
            0% {
                clip-path: circle(calc(.25rem * var(--cds-rem-scale, 1)))
            }

            to {
                clip-path: circle(50%)
            }
        }

        @keyframes frame-claude-lands-veil {
            0% {
                opacity: 1
            }
        }

        [data-claude-lands] {
            animation: frame-claude-lands var(--cds-dur-base) var(--cds-ease-out);
            position: relative
        }

        [data-claude-lands]:after {
            content: "";
            background: var(--cds-fill-brand);
            opacity: 0;
            pointer-events: none;
            animation: frame-claude-lands-veil var(--cds-dur-base) var(--cds-ease-out);
            border-radius: 9999px;
            position: absolute;
            inset: 0
        }

        @media (prefers-reduced-motion:reduce) {

            [data-claude-lands],
            [data-claude-lands]:after {
                animation: none
            }
        }

        @keyframes frame-comment-pulse {
            0% {
                outline-color: var(--cds-fill-accent, currentColor);
                outline-offset: 0
            }

            to {
                outline-offset: 6px;
                outline-color: #0000
            }
        }

        .frame-comment-pulse {
            outline: 2px solid #0000;
            animation: 1.3s ease-out frame-comment-pulse
        }

        .frame-comment-in.frame-comment-pulse {
            animation: .28s cubic-bezier(.4, 0, .2, 1) frame-comment-in, 1.3s ease-out frame-comment-pulse
        }

        @media (prefers-reduced-motion:reduce) {

            .frame-comment-pulse,
            .frame-comment-in.frame-comment-pulse {
                animation: none
            }

            .frame-comment-pulse-pin {
                outline-color: var(--cds-fill-accent, currentColor)
            }
        }

        .frame-comment-ring {
            z-index: calc(var(--cds-layer-base, 0) + 1)
        }

        .frame-comment-rest {
            z-index: calc(var(--cds-layer-base, 0) + 2)
        }

        .frame-comment-rest:has(:hover),
        .frame-comment-rest:focus-within {
            z-index: calc(var(--cds-layer-base, 0) + 3)
        }

        .frame-comment-rest:has(:hover):has(:focus-visible) [data-comment-preview]:after {
            content: "";
            border-radius: inherit;
            pointer-events: none;
            box-shadow: var(--cds-focus-shadow);
            outline-offset: -2px;
            outline: 2px solid #0000;
            position: absolute;
            inset: 0
        }

        [data-comment-morph=card] {
            opacity: 0;
            clip-path: var(--pv-clip);
            transition: clip-path var(--cds-dur-snap) ease-out, opacity 0s linear var(--cds-dur-snap)
        }

        [data-comment-morph=pin] {
            transition: opacity 0s linear calc(var(--cds-dur-snap) - 30ms)
        }

        [data-comment-morph=card] [data-comment-words] {
            opacity: 0;
            transition: opacity calc(var(--cds-dur-snap) * .4) linear
        }

        @media (hover:hover) {
            .frame-comment-rest:hover [data-comment-morph=card] {
                opacity: 1;
                clip-path: inset(-40px round calc(var(--cds-radius) + 44px));
                transition: clip-path var(--cds-dur-snap) ease-out, opacity 0s
            }

            .frame-comment-rest:hover [data-comment-morph=pin] {
                opacity: 0;
                transition: opacity
            }

            .frame-comment-rest:hover [data-comment-morph=card] [data-comment-words] {
                opacity: 1;
                transition: opacity calc(var(--cds-dur-snap) * .4) linear calc(var(--cds-dur-snap) * .6)
            }
        }

        @media (prefers-reduced-motion:reduce) {

            [data-comment-morph],
            .frame-comment-rest:hover [data-comment-morph],
            [data-comment-morph=card] [data-comment-words],
            .frame-comment-rest:hover [data-comment-morph=card] [data-comment-words] {
                transition: none
            }
        }

        [data-comments-drawer] {
            --cds-comment-card-bg: var(--cds-surface-2)
        }

        [data-comment-drawer-thread]:not([data-comment-goto]) [data-comment-row-card]:not([data-open-row]) {
            --cds-comment-card-hover-tint: transparent
        }

        @media (hover:hover) {
            [data-comment-goto]:hover [data-comment-row-card] {
                --cds-comment-card-hover-tint: var(--cds-fill-ghost-hover)
            }
        }

        @supports not (animation-timeline:scroll()) {
            [data-comment-list] {
                mask-image: linear-gradient(#000 calc(100% - 16px), #0000)
            }
        }

        .frame-comment-open {
            z-index: calc(var(--cds-layer-base, 0) + 4)
        }

        @supports not selector(::-webkit-scrollbar) {
            .frame-comment-scroll {
                scrollbar-width: thin;
                scrollbar-color: color-mix(in srgb, currentColor 35%, transparent) transparent
            }
        }

        .frame-comment-scroll::-webkit-scrollbar {
            width: 6px
        }

        .frame-comment-scroll::-webkit-scrollbar-track {
            background: 0 0
        }

        .frame-comment-scroll::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, currentColor 35%, transparent);
            border-radius: 3px
        }

        .frame-comment-scroll::-webkit-scrollbar-button {
            width: 0;
            height: 0;
            display: none
        }

        [data-comments-panel],
        [data-diag-panel] {
            top: var(--bar, 40px);
            inset-inline-end: var(--host-inset-end, 0px);
            bottom: var(--keyboard-inset, 0px);
            width: var(--session-panel-w, 340px);
            max-width: var(--host-clear-width, 100vw);
            z-index: 20;
            position: fixed
        }

        [data-session-resize] {
            top: 0;
            bottom: 0;
            cursor: col-resize;
            touch-action: none;
            width: 12px;
            position: absolute;
            inset-inline-start: -6px
        }

        [data-session-resize]:before {
            content: "";
            top: 50%;
            background: var(--cds-alpha-6);
            opacity: 0;
            border-radius: 3px;
            width: 3px;
            height: 48px;
            transition: opacity .2s .2s;
            position: absolute;
            inset-inline-start: 5px;
            transform: translateY(-50%)
        }

        [data-session-resize]:hover:before,
        [data-session-resize]:active:before {
            opacity: 1
        }

        [data-session-resize]:focus-visible {
            outline: none
        }

        [data-session-resize]:focus-visible:before {
            opacity: 1;
            background: var(--cds-fill-accent);
            transition: opacity .2s
        }

        @media (prefers-reduced-motion:reduce) {
            [data-session-resize]:before {
                transition: none
            }
        }

        aside[data-comments-drawer] {
            top: calc(var(--bar, 40px) + 12px);
            inset-inline-end: calc(12px + var(--host-inset-end, 0px));
            max-height: calc(100vh - var(--bar, 40px) - 24px - var(--keyboard-inset, 0px));
            max-height: calc(100dvh - var(--bar, 40px) - 24px - var(--keyboard-inset, 0px));
            width: 300px;
            bottom: auto
        }

        .comment-dot-knockout {
            box-shadow: 0 0 0 2px var(--cds-page-bg)
        }

        @media (width<=480px) {
            aside[data-diag-panel] {
                width: var(--host-clear-width, 100vw);
                border-inline-start: none
            }
        }

        aside[data-comments-panel][data-sheet] {
            width: var(--host-clear-width, 100vw);
            border-inline-start: none
        }

        aside[data-comments-drawer][data-sheet] {
            top: var(--bar, 40px);
            inset-inline-end: var(--host-inset-end, 0px);
            bottom: var(--keyboard-inset, 0px);
            width: var(--host-clear-width, 100vw);
            border: none;
            border-radius: 0;
            max-height: none
        }

        aside[data-sheet] [data-session-resize] {
            display: none
        }

        .follow-frame {
            z-index: 1;
            pointer-events: none;
            outline-offset: -2px;
            outline: 2px solid;
            position: absolute;
            inset: 0
        }

        .follow-in {
            animation: follow-in var(--cds-dur-base) var(--cds-ease-out)
        }

        @keyframes follow-in {
            0% {
                opacity: 0
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .follow-in {
                animation: none
            }
        }

        @media print {
            .follow-frame {
                display: none
            }
        }
